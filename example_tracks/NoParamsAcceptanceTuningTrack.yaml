Global:
  name: "Ensemble"

  volume:
    nx: 4
    ny: 4
    nz: 4
    nt: 4


  checkpoint:
    saveInterval: 5
    format: "IEEE64BIG"

    configurations:
      prefix: "cfg_ckpoint"

    rng:
      prefix: "rng_ckpoint"

  HMC:
    MD:
      initialMDsteps: 10
      trajL: 2.0

    Thermalisations: 5

    Trajectories: 1000

    StartingType: "HotStart"

  AcceptanceRateTuning:
    rethermalisationTrajectories: 6
    tuningCycleTrajectories: 7
    targetAcceptance: 0.85
    deltaTargetAcceptance: 0.1
    monitoringCycleTrajectories: 100
    maxTuningTrajectories: 250

NoParams:
